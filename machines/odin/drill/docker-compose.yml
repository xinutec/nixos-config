# Nextcloud restore drill on odin. See README.md for context.
#
# All credentials below are THROWAWAY DRILL VALUES. They are not used
# by production and they stay inside /var/lib/drill/volumes/ which is root-only on
# odin. Do not copy these to prod.
#
# Listens on 127.0.0.1:8443 only. Access via:
#   ssh -L 8443:127.0.0.1:8443 odin.xinutec.org
#   open http://127.0.0.1:8443/
#
# Every image is a REQUIRED VARIABLE, filled by `plan-run` with the image
# production's container runs, by digest, as the drill starts. No version is
# written here, so the drill cannot fall behind production; without the
# variables compose refuses to start. The drill itself is declared in
# xinutec-infra's plan/tables/drill_rows.dhall.

name: nc-drill

networks:
  drill:
    driver: bridge

services:

  db:
    image: ${DRILL_IMAGE_DB:?production's mariadb, filled by plan-run}
    container_name: drill-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: drill-root-pw
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: drill-nc-pw
    volumes:
      - /var/lib/drill/volumes/mysql:/var/lib/mysql
    networks:
      - drill
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent || exit 1"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${DRILL_IMAGE_REDIS:?production's redis, filled by plan-run}
    container_name: drill-redis
    restart: unless-stopped
    volumes:
      - /var/lib/drill/volumes/redis:/data
    networks:
      - drill
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nextcloud:
    image: ${DRILL_IMAGE_NEXTCLOUD:?production's nextcloud, filled by plan-run}
    container_name: drill-nextcloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Consulted only by a first-run install against empty volumes. A
      # restore keeps its own config.php, and the drill's seed adds
      # zz-drill.config.php to point it at the services below.
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: drill-nc-pw
      REDIS_HOST: redis
      REDIS_HOST_PORT: "6379"
      NEXTCLOUD_ADMIN_USER: drill-admin
      NEXTCLOUD_ADMIN_PASSWORD: drill-admin-pw
      NEXTCLOUD_TRUSTED_DOMAINS: "127.0.0.1 drill.localhost"
      OVERWRITEPROTOCOL: http
      OVERWRITEHOST: "127.0.0.1:8443"
    volumes:
      - /var/lib/drill/volumes/nextcloud:/var/www/html
    networks:
      - drill

  web:
    image: ${DRILL_IMAGE_WEB:?production's nginx, filled by plan-run}
    container_name: drill-web
    restart: unless-stopped
    depends_on:
      - nextcloud
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # nginx serves static assets directly from the Nextcloud
      # document root, so it needs read-only access to the same
      # volume the FPM container writes to.
      - /var/lib/drill/volumes/nextcloud:/var/www/html:ro
    ports:
      - "127.0.0.1:8443:80"
    networks:
      - drill
