# Nextcloud restore drill on odin. See README.md for context.
#
# All credentials below are THROWAWAY DRILL VALUES. They are not used
# by production and they stay inside /var/lib/drill/volumes/ which is root-only on
# odin. Do not copy these to prod.
#
# Listens on 127.0.0.1:8443 only. Access via:
#   ssh -L 8443:127.0.0.1:8443 odin.xinutec.org
#   open http://127.0.0.1:8443/
#
# Image tags match prod exactly, so a successful drill proves the
# images prod runs can open the restored data. Bump prod and bump
# these in the same change, or the drill stops testing prod.

name: nc-drill

networks:
  drill:
    driver: bridge

services:

  db:
    image: mariadb:12.3
    container_name: drill-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: drill-root-pw
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: drill-nc-pw
    volumes:
      - /var/lib/drill/volumes/mysql:/var/lib/mysql
    networks:
      - drill
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent || exit 1"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # The image production runs (kubes nextcloud/k8s/redis.yaml), held here at
    # production's digest like the others. It used to differ while production
    # ran bitnami's image; since 2026-10-03 both are the official one.
    image: redis:8.2-alpine
    container_name: drill-redis
    restart: unless-stopped
    volumes:
      - /var/lib/drill/volumes/redis:/data
    networks:
      - drill
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nextcloud:
    image: nextcloud:33.0.2-fpm-alpine
    container_name: drill-nextcloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # These env vars are ONLY consulted during first-run
      # auto-install (stage 1 smoke test, empty volumes). For
      # stage 2 restore, config.php from the restored PVC is
      # authoritative and drill-seed.sh patches the hostnames
      # inside it to point here.
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: drill-nc-pw
      REDIS_HOST: redis
      REDIS_HOST_PORT: "6379"
      NEXTCLOUD_ADMIN_USER: drill-admin
      NEXTCLOUD_ADMIN_PASSWORD: drill-admin-pw
      NEXTCLOUD_TRUSTED_DOMAINS: "127.0.0.1 drill.localhost"
      OVERWRITEPROTOCOL: http
      OVERWRITEHOST: "127.0.0.1:8443"
    volumes:
      - /var/lib/drill/volumes/nextcloud:/var/www/html
    networks:
      - drill

  web:
    image: nginx:alpine
    container_name: drill-web
    restart: unless-stopped
    depends_on:
      - nextcloud
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # nginx serves static assets directly from the Nextcloud
      # document root, so it needs read-only access to the same
      # volume the FPM container writes to.
      - /var/lib/drill/volumes/nextcloud:/var/www/html:ro
    ports:
      - "127.0.0.1:8443:80"
    networks:
      - drill
